[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-pipeline"
version = "0.1.0"
description = "Offline scene compiler for the Taipei open-data 3D digital twin (RFC module 1)."
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    # pyosmium publishes on PyPI under the distribution name "osmium"
    # (import name is also "osmium").
    "osmium>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
